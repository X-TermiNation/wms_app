publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  get: ^4.7.3
  http: ^1.6.0
  shared_preferences: ^2.5.5
  print_bluetooth_thermal: 1.2.1
  image_picker: ^1.2.2
